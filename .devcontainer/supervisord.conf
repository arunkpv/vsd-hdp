[supervisord]
nodaemon=true
user=vscode
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:vnc]
command=/usr/local/bin/setup-vnc.sh
user=vscode
autostart=true
autorestart=true
stdout_logfile=/tmp/vncserver.log
stderr_logfile=/tmp/vncserver.err

[program:novnc]
command=/usr/local/bin/start-novnc.sh
user=vscode
autostart=true
autorestart=true
stdout_logfile=/tmp/novnc.log
stderr_logfile=/tmp/novnc.err
